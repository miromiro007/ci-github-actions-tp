name: Hello CI
env:
  PROJECT_NAME: ci-github-actions-tp
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ 18, 20, 22 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Afficher le nom du projet
        run: echo "Le nom du projet est $PROJECT_NAME"
      - name: Utiliser le secret
        run: echo "Le token vaut - $TOKEN"
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Installer les dependances
        run: npm ci
      - name: Lancer les tests
        run: npm test
  lint:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm ci
      - name: Verifier le code avec ESLint
        run: npx eslint src/