name: Hello CI
env:
  PROJECT_NAME: ci-github-actions-tp
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ 18, 20, 22 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Inspecter le runner
        shell: bash
        run: |
          echo "OS : ${{ runner.os }}"
          echo "Arch : ${{ runner.arch }}"
          nproc || echo "nproc non disponible sur cet OS"
          free -h || echo "free non disponible sur cet OS" 
      - name: Afficher le nom du projet
        run: echo "Le nom du projet est $PROJECT_NAME"
      - name: Utiliser le secret
        run: echo "Le token vaut - $TOKEN"
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Installer les dependances
        run: npm ci
      - name: Lancer les tests avec couverture
        run: npm test -- --coverage
      - name: Generer un rapport
        run: echo "Tests reussis sur Node ${{ matrix.node }} / ${{ matrix.os }}" > rapport.txt
      - name: Upload du rapport
        uses: actions/upload-artifact@v7
        with:
          name: rapport-${{ matrix.os }}-${{ matrix.node }}
          path: rapport.txt
  lint:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm ci
      - name: Verifier le code avec ESLint
        run: npx eslint src/
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}