name: Hello CI
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm ci
      - name: Lancer les tests
        run: npm test
  lint:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm ci
      - name: Verifier le code avec ESLint
        run: npx eslint src/ --no-eslintrc --env node,es2021 --parser-options=ecmaVersion:2021